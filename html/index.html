<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/css/style.css">

    <title>Game Library</title>
</head>

<body>

    <header>
        <div id="logo-library">
            <img src="/img/transferir.png" alt="logotipo-library">
        </div>
    </header>

    <main>
        
        <section class="add-games">

            <h2>Add Game to Library</h2>

            <form id="form-game">

                <input id="title" type="text" placeholder="Title" required>

                <input id="genre" type="text" placeholder="Genre" required>

                <input id="platform" type="text" placeholder="Platform" required>

                <input id="release-year" type="date" required>

                <input id="rating" type="number" step="0.01" placeholder="Rating of the game">

                <input id="description" type="text" placeholder="Brief description of the game" required>

                <button type="submit">
                    Add Game
                </button>

            </form>

        </section>

        <section class="list-games">

            <h2>List of games</h2>

            <div id="container-games">
            </div>

        </section>

        <section class="actions">

            <div id="find-by-id">

                <h2>Search for a game by ID</h2>

                <div class="search">

                    <input type="number" id="id" placeholder="Digite o ID do jogo">

                    <button id="search-by-id">
                        Search
                    </button>

                </div>

                <div id="searching-game-id">
                </div>

            </div>

            <div id="find-by-title">

                <h2>Search for a Game by Title</h2>

                <div class="search">

                    <input type="text" id="search-title" placeholder="Digite o título do jogo">

                    <button id="search-by-title">
                        Search
                    </button>

                </div>

                <div id="searching-game-title">
                </div>

            </div>

            <div id="update-area">

                <h2>Update Game</h2>

                <form id="update-form-game">

                    <input id="update-id" type="number" placeholder="Game ID" required>

                    <input id="new-title" type="text" placeholder="New Title" required>

                    <input id="new-genre" type="text" placeholder="New Genre" required>

                    <input id="new-platform" type="text" placeholder="New Platform" required>

                    <input id="new-release-year" type="date" required>

                    <input id="new-rating" type="number" step="0.01" placeholder="New Rating of the game">

                    <input id="new-description" type="text" placeholder="New game description" required>

                    <button type="submit">
                        Update
                    </button>

                </form>

            </div>

        </section>

    </main>

    <footer>

        <p>Game Library © 2026</p>

        <p>
            Project developed using HTML, CSS, JavaScript, and Spring Boot.
        </p>

    </footer>


    <script type="module" src="/js/app.js"></script>

</body>

</html>
